name: finecity_landscape
description: "Finecity Landscape — Employee Plant Care App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.0.0

  # Network
  dio: ^5.0.0
  connectivity_plus: ^6.0.0

  # DI
  get_it: ^8.0.0

  # Local storage
  shared_preferences: ^2.3.0
  sqflite: ^2.4.0
  path: ^1.9.0

  # Functional
  dartz: ^0.10.1

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0

  # UI
  cached_network_image: ^3.4.0
  google_fonts: ^6.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Media
  image_picker: ^1.1.2

  # System
  app_settings: ^5.1.1
  package_info_plus: ^8.0.0

  # Date/Time
  intl: ^0.19.0
  timezone: ^0.10.0

  # Environment configuration
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
